general:
  # Commands to run when the WM has started. This is useful for running a
  # script or launching another application.
  # Example: The below command launches Zebar.
  startup_commands: ['shell-exec zebar']

  # Commands to run just before the WM is shutdown.
  # Example: The below command kills Zebar.
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']

  # Commands to run after the WM config is reloaded.
  config_reload_commands: []

  # Whether to automatically focus windows underneath the cursor.
  focus_follows_cursor: false

  # Whether to switch back and forth between the previously focused
  # workspace when focusing the current workspace.
  toggle_workspace_on_refocus: true

  cursor_jump:
    # Whether to automatically move the cursor on the specified trigger.
    enabled: true

    # Trigger for cursor jump:
    # - 'monitor_focus': Jump when focus changes between monitors.
    # - 'window_focus': Jump when focus changes between windows.
    trigger: 'monitor_focus'

  # How windows should be hidden when switching workspaces.
  # - 'cloak': (Windows-only) Recommended option for Windows.
  # - 'hide': (Windows-only) Legacy option for Windows. Has stability issues with some apps.
  # - 'place_in_corner': Artifically hides the window by placing it in the corner of the
  #   monitor. On macOS, this is always used instead of cloak/hide.
  hide_method: 'cloak'

  # Affects which windows get shown in the native Windows taskbar. Has no
  # effect if `hide_method: 'hide'`.
  # - 'true': Show all windows (regardless of workspace).
  # - 'false': Only show windows from the currently shown workspaces.
  show_all_in_taskbar: false

  # Animate windows. Windows are animated via live compositor thumbnails,
  # so animations stay smooth regardless of how busy an application is.
  # Requires `hide_method: 'cloak'`. Minimize/restore/close animations
  # aren't handled here — use a tool such as Windhawk for those.
  animations:
    # Whether window animations are enabled.
    enabled: false

    # Animation to play when the displayed workspace on a monitor changes.
    workspace_switch:
      # - 'none': No animation.
      # - 'slide': Windows slide horizontally.
      # - 'slide_vert': Windows slide vertically.
      # - 'fade': The workspaces cross-fade in place.
      style: 'slide'

      # Where the incoming workspace slides in from. 'auto' derives the
      # direction from the workspace switch (e.g. focusing the next
      # workspace slides in from the right; with 'slide_vert' it rises
      # from the bottom edge).
      # 'left'/'right': the side the incoming workspace comes in from.
      # 'up'/'down': the direction the windows travel ('up' rises from
      # the bottom edge, 'down' descends from the top edge).
      # Directions that don't match the style's axis are treated as
      # 'auto'.
      # - 'auto' | 'left' | 'right' | 'up' | 'down'.
      direction: 'auto'

      # How long the animation lasts, in milliseconds.
      duration_ms: 250

      # Easing curve as cubic-bezier control points [x1, y1, x2, y2].
      # Ease-out: the workspace glides into place. Values of y outside
      # 0-1 are clamped (an overshoot would read as a bounce).
      curve: [0.22, 1.0, 0.36, 1.0]

    # Animation to play when a window is first shown (e.g. an application
    # that's launched). Windows that an external tool animates (marked with
    # the `WindhawkAnimations.Concealed` window property, e.g. by the
    # Windhawk "Hyprland Animations" mod) are left to that tool.
    window_open:
      # - 'none': No animation.
      # - 'slide': Window slides in from the right edge of the monitor.
      # - 'slide_vert': Window slides in from the bottom edge of the
      #   monitor.
      # - 'popin': Window grows into place while fading in.
      # - 'fade': Window fades in.
      style: 'slide'

      # How long the animation lasts, in milliseconds.
      duration_ms: 200

      # Easing curve as cubic-bezier control points [x1, y1, x2, y2].
      curve: [0.22, 1.0, 0.36, 1.0]

    # Animation to play when a visible window changes position or size
    # (e.g. windows reflowing when a window opens or closes, windows being
    # moved, swapped, or resized, layout switches, and the strip of a
    # scrolling workspace scrolling). Windows that are already animating
    # smoothly redirect to their new position instead of snapping.
    window_move:
      # Whether the animation is enabled.
      enabled: true

      # How long the animation lasts, in milliseconds.
      duration_ms: 150

      # Easing curve as cubic-bezier control points [x1, y1, x2, y2].
      curve: [0.22, 1.0, 0.36, 1.0]

gaps:
  # Whether to scale the gaps with the DPI of the monitor.
  scale_with_dpi: true

  # Gap between adjacent windows.
  inner_gap: '20px'

  # Gap between windows and the screen edge.
  outer_gap:
    top: '60px'
    right: '20px'
    bottom: '20px'
    left: '20px'

  # Gap between a lone window and the screen edge. Only applies when the
  # workspace has a single tiling window; `outer_gap` is used in every
  # other case. Omit this key to use `outer_gap` everywhere.
  #single_window_outer_gap:
  #  top: '60px'
  #  right: '20px'
  #  bottom: '20px'
  #  left: '20px'

window_effects:
  # Visual effects to apply to the focused window.
  focused_window:
    # Highlight the window with a colored border.
    # ** Exclusive to Windows 11 due to API limitations.
    border:
      enabled: true
      color: '#8dbcff'

    # Remove the title bar from the window's frame. Note that this can
    # cause rendering issues for some applications.
    hide_title_bar:
      enabled: false

    # Change the corner style of the window's frame.
    # ** Exclusive to Windows 11 due to API limitations.
    corner_style:
      enabled: false
      # Allowed values: 'square', 'rounded', 'small_rounded'.
      style: 'square'

    # Change the transparency of the window.
    transparency:
      enabled: false
      # Can be something like '95%' or '0.95' for slightly transparent windows.
      # '0' or '0%' is fully transparent (and, by consequence, unfocusable).
      opacity: '95%'

  # Visual effects to apply to non-focused windows.
  other_windows:
    border:
      enabled: true
      color: '#a1a1a1'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: false
      opacity: '0%'

window_behavior:
  # New windows are created in this state whenever possible.
  # Allowed values: 'tiling', 'floating'.
  initial_state: 'tiling'

  # Sets the default options for when a new window is created. This also
  # changes the defaults for when the state change commands, like
  # `set-floating`, are used without any flags.
  state_defaults:
    floating:
      # Whether to center floating windows by default.
      centered: true

      # Whether to show floating windows as always on top.
      shown_on_top: false

    fullscreen:
      # Maximize the window if possible. If the window doesn't have a
      # maximize button, then it'll be fullscreen'ed normally instead.
      maximized: true

      # Whether to show fullscreen windows as always on top.
      shown_on_top: false

# Layout config shared by all workspaces. Workspaces inherit these
# values and can override them individually.
#
# These are the defaults used by this fork. The built-in defaults differ
# for `default` ('tiling'), `switch_behavior` ('reflow'), the scroll axis
# ('horizontal'), the item sizes (0.5), `align` ('minimal'), and
# `offscreen_windows` ('hide').
layout:
  # Layout used by workspaces that don't set their own `layout`.
  # - 'tiling': Windows share the viewport.
  # - 'scrolling': Windows form a strip along the scroll axis, and the
  #   viewport scrolls to keep the focused window in view (inspired by
  #   niri/PaperWM).
  # - 'bsp': Windows form a binary tree of splits; inserting a window
  #   splits the focused window's space in half (like bspwm).
  default: 'scrolling'

  # What happens to the existing windows of a workspace when its layout
  # is switched (via `set-layout`, `cycle-layout`, or a config reload).
  # Can be overridden per workspace with `layout_switch`.
  # - 'reflow': Existing windows are rearranged into the new layout.
  # - 'keep': Existing windows keep their arrangement; only windows that
  #   are added afterwards follow the new layout.
  switch_behavior: 'keep'

  # Options for the tiling layout. The tiling layout has no options
  # yet.
  tiling: {}

  # Options for the scrolling layout.
  scrolling:
    # Axis that the strip of windows scrolls along. Also the initial
    # tiling direction of a scrolling workspace: `toggle-tiling-direction`
    # flips it at runtime, and that change is not written back here.
    axis: 'vertical'
    # Default width of new windows as a fraction of the viewport
    # width. Used while the scroll axis is horizontal.
    window_width: 0.7
    # Default height of new windows as a fraction of the viewport
    # height. Used while the scroll axis is vertical.
    window_height: 0.7
    # Sizes that `cycle-preset-size` cycles the focused window
    # through (fractions of the viewport), for a horizontal and a
    # vertical scroll axis respectively.
    preset_widths: [0.3, 0.5, 0.7, 1.0]
    preset_heights: [0.5, 1.0]
    # How the focused window is scrolled into view:
    # - 'minimal': Scroll the least amount required (niri-like).
    # - 'center': Center the focused window in the viewport.
    align: 'center'
    # Where new windows are inserted in the strip:
    # - 'start': Insert at the start of the strip (top/left).
    # - 'before_focused': Insert directly before the focused window.
    # - 'after_focused': Insert directly after the focused window.
    # - 'end': Append to the end of the strip (bottom/right).
    insert_position: 'after_focused'
    # How windows scrolled out of view are kept out of view:
    # - 'hide': Hidden with the hide method (not listed in Alt+Tab).
    # - 'park': Moved beyond the edges of all monitors while staying
    #   shown, so they remain in Alt+Tab and the taskbar. Picking one
    #   in Alt+Tab scrolls it into view.
    offscreen_windows: 'park'

  # Options for the BSP layout.
  bsp:
    # How the direction of a new split is chosen:
    # - 'longest_side': Split the longer side of the focused window
    #   (default, like bspwm).
    # - 'alternate': Alternate the split direction with the depth of
    #   the tree.
    automatic_scheme: 'longest_side'

workspaces:
  - name: '1'
    # Optional display name for the workspace, used by 3rd-party apps
    # (e.g. Zebar). Defaults to the workspace name.
    #display_name: 'Work'
    # Optionally prevent the workspace from being deactivated when it's
    # empty. Defaults to false.
    #keep_alive: false
    # Layout used by the workspace. Overrides `layout.default`.
    # - 'tiling': Windows share the viewport.
    # - 'scrolling': Windows form a strip along the scroll axis, and the
    #   viewport scrolls to keep the focused window in view (inspired by
    #   niri/PaperWM).
    # - 'bsp': Windows form a binary tree of splits; inserting a window
    #   splits the focused window's space in half (like bspwm).
    # Omit this key to inherit `layout.default` ('scrolling').
    #layout: 'scrolling'
    # Overrides the global layout options for this workspace. Only the
    # given options are overridden; the rest are inherited.
    #layout_overrides:
    #  scrolling:
    #    window_width: 0.5
    #  bsp:
    #    automatic_scheme: 'alternate'
    # Overrides `layout.switch_behavior` for this workspace.
    #layout_switch: 'reflow'
    # The layout can be switched at runtime, and the strip scrolled along
    # its axis without moving focus:
    #   `set-layout --layout scrolling --workspace 1`
    #   `set-layout --layout bsp --workspace 1`
    #   `scroll --direction left --amount 10%`
    # The focused window can also be resized to the next preset size, or
    # centered in the viewport:
    #   `cycle-preset-size` (or `cycle-preset-size --reverse`)
    #   `center-focused`
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'

window_rules:
  - commands: ['ignore']
    match:
      # Ignores any Zebar windows.
      - window_process: { equals: 'zebar' }

      # Ignores picture-in-picture windows for browsers.
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

      # Ignore rules for various 3rd-party apps.
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }
      - window_process: { equals: 'CleanShot X' }

binding_modes:
  # When enabled, the focused window can be resized via arrow keys or HJKL.
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      # Cycle the focused window through the preset sizes of the scrolling
      # layout (`layout.scrolling.preset_widths` / `preset_heights`).
      # Only scrolling workspaces have preset sizes, so this does nothing
      # in a tiling or BSP workspace.
      # The `+` key needs shift on most keyboard layouts, so it's spelled
      # out as `shift` + the `=` key.
      - commands: ['cycle-preset-size']
        bindings: ['shift+oem_plus']
      - commands: ['cycle-preset-size --reverse']
        bindings: ['oem_minus']
      # Press escape/enter/alt+r to return to default keybindings.
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter', 'alt+r']

keybindings:
  # Shift focus in a given direction.
  - commands: ['focus --direction left']
    bindings: ['alt+h', 'alt+left']
  - commands: ['focus --direction right']
    bindings: ['alt+l', 'alt+right']
  - commands: ['focus --direction up']
    bindings: ['alt+k', 'alt+up']
  - commands: ['focus --direction down']
    bindings: ['alt+j', 'alt+down']

  # Move focused window in a given direction.
  - commands: ['move --direction left']
    bindings: ['alt+shift+h', 'alt+shift+left']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l', 'alt+shift+right']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k', 'alt+shift+up']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j', 'alt+shift+down']

  # Resize focused window by a percentage or pixel amount.
  - commands: ['resize --width -2%']
    bindings: ['alt+u']
  - commands: ['resize --width +2%']
    bindings: ['alt+p']
  - commands: ['resize --height +2%']
    bindings: ['alt+o']
  - commands: ['resize --height -2%']
    bindings: ['alt+i']

  # As an alternative to the resize keybindings above, resize mode enables
  # resizing via arrow keys or HJKL. The binding mode is defined above with
  # the name 'resize'.
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+r']

  # Disables window management and all other keybindings until alt+shift+p
  # is pressed again.
  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']

  # Change tiling direction. This determines where new tiling windows will
  # be inserted.
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+v']

  # Cycle the layout used by the focused workspace
  # (tiling -> scrolling -> bsp).
  # The layout can also be set directly, e.g.:
  #   `set-layout --layout scrolling`
  #   `set-layout --layout bsp`
  #   `set-layout --layout tiling --workspace 2`
  # Runtime switches are kept for the session; set the workspace's
  # `layout` in this config for a permanent choice.
  - commands: ['cycle-layout']
    bindings: ['alt+shift+v']

  # Change focus from tiling windows -> floating -> fullscreen.
  - commands: ['wm-cycle-focus']
    bindings: ['alt+space']

  # Change the focused window to be floating.
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']

  # Change the focused window to be tiling.
  - commands: ['toggle-tiling']
    bindings: ['alt+t']

  # Change the focused window to be fullscreen.
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']

  # Minimize focused window.
  - commands: ['toggle-minimized']
    bindings: ['alt+m']

  # Close focused window.
  - commands: ['close']
    bindings: ['alt+shift+q']

  # Kill GlideWM process safely.
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']

  # Re-evaluate configuration file.
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']

  # Redraw all windows.
  - commands: ['wm-redraw']
    bindings: ['alt+shift+w']

  # Launch CMD terminal. Alternatively, use `shell-exec wt` or
  # `shell-exec %ProgramFiles%/Git/git-bash.exe` to start Windows
  # Terminal and Git Bash respectively.
  - commands: ['shell-exec cmd']
    bindings: ['alt+enter']

  # Focus the next/previous active workspace defined in `workspaces` config.
  - commands: ['focus --next-active-workspace']
    bindings: ['alt+s']
  - commands: ['focus --prev-active-workspace']
    bindings: ['alt+a']

  # Focus the workspace that last had focus.
  - commands: ['focus --recent-workspace']
    bindings: ['alt+d']

  # Change focus to a workspace defined in `workspaces` config.
  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']

  # Move the focused window's parent workspace to a monitor in a given
  # direction.
  - commands: ['move-workspace --direction left']
    bindings: ['alt+shift+a']
  - commands: ['move-workspace --direction right']
    bindings: ['alt+shift+f']
  - commands: ['move-workspace --direction up']
    bindings: ['alt+shift+d']
  - commands: ['move-workspace --direction down']
    bindings: ['alt+shift+s']

  # Move focused window to a workspace defined in `workspaces` config.
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['alt+shift+9']
